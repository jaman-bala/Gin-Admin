version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - gocyclo
    - misspell
    - revive
  settings:
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      # Table-driven and integration tests are long by nature.
      - path: _test\.go
        linters:
          - gocyclo
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
