definitions:
  analytics.UserStats:
    properties:
      active:
        format: int64
        type: integer
      admins:
        format: int64
        type: integer
      inactive:
        format: int64
        type: integer
      newThisMonth:
        format: int64
        type: integer
      total:
        format: int64
        type: integer
    type: object
  auth.LoginRequestDTO:
    properties:
      password:
        example: Password123
        minLength: 8
        type: string
      phone:
        example: "+996500500500"
        type: string
    required:
    - password
    - phone
    type: object
  auth.RefreshTokenRequest:
    properties:
      refresh_token:
        example: refresh_token
        type: string
    type: object
  user.Role:
    enum:
    - superuser
    - admin
    - user
    type: string
    x-enum-varnames:
    - RoleSuperuser
    - RoleAdmin
    - RoleUser
  user.UserListResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/user.UserResponseDTO'
        type: array
    type: object
  user.UserResponseDTO:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_name:
        type: string
      middle_name:
        type: string
      phone:
        type: string
      photo:
        type: string
      role:
        $ref: '#/definitions/user.Role'
      updated_at:
        type: string
    type: object
host: localhost:8082
info:
  contact: {}
  description: API for managing users and authentication in the Auth Service application.
  title: AUTH SERVICE API
  version: "1.0"
paths:
  /api/v1/audit:
    get:
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get all user actions
      tags:
      - audit
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequestDTO'
      produces:
      - application/json
      responses: {}
      summary: Login user
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      responses: {}
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponseDTO'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses: {}
      summary: Refresh token
      tags:
      - auth
  /api/v1/users:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Search by name or phone
        in: query
        name: search
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserListResponse'
      security:
      - BearerAuth: []
      summary: Get all users with pagination
      tags:
      - users
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: First name
        in: formData
        name: first_name
        required: true
        type: string
      - description: Last name
        in: formData
        name: last_name
        required: true
        type: string
      - description: Middle name
        in: formData
        name: middle_name
        type: string
      - description: Phone number
        in: formData
        name: phone
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      - default: user
        description: Role
        enum:
        - user
        - admin
        - superuser
        in: formData
        name: role
        type: string
      - description: User photo
        in: formData
        name: photo
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponseDTO'
      security:
      - BearerAuth: []
      summary: Create user (admin only)
      tags:
      - users
  /api/v1/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses: {}
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - users
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - users
    patch:
      consumes:
      - multipart/form-data
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: First Name
        in: formData
        name: first_name
        type: string
      - description: Last Name
        in: formData
        name: last_name
        type: string
      - description: Middle Name
        in: formData
        name: middle_name
        type: string
      - description: Phone
        in: formData
        name: phone
        type: string
      - description: Role
        in: formData
        name: role
        type: string
      - description: Is Active
        in: formData
        name: is_active
        type: boolean
      - description: Profile Photo
        in: formData
        name: photo
        type: file
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - users
  /api/v1/users/me:
    put:
      consumes:
      - application/json
      - multipart/form-data
      parameters:
      - description: First Name
        in: formData
        name: first_name
        type: string
      - description: Last Name
        in: formData
        name: last_name
        type: string
      - description: Middle Name
        in: formData
        name: middle_name
        type: string
      - description: Phone
        in: formData
        name: phone
        type: string
      - description: Profile Photo
        in: formData
        name: photo
        type: file
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Update own profile
      tags:
      - users
  /api/v1/users/phone/{phone}:
    get:
      parameters:
      - description: User phone
        in: path
        name: phone
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get user by phone
      tags:
      - users
  /api/v1/users/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.UserStats'
      security:
      - BearerAuth: []
      summary: Get user statistics
      tags:
      - analytics
securityDefinitions:
  BearerAuth:
    description: 'Enter: Bearer {your_jwt_token} (e.g., Bearer eyJhbGciOiJIUzI1NiIs...)'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
