server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy MinIO avatars bucket
    location /avatars/ {
        resolver 127.0.0.11 valid=30s;
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream;
        proxy_set_header Host minio:9000;
        proxy_buffering off;
    }

    # Proxy API requests to the backend container
    location /api/ {
        # Перенаправляем на backend:8082. 
        # Если фронтенд присылает /api/auth/login, проксируем на /api/v1/auth/login
        proxy_pass http://backend:8082/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10M;
    }
}
