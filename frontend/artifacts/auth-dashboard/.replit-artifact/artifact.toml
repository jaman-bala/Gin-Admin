kind = "web"
previewPath = "/"
title = "Auth Dashboard"
version = "1.0.0"
id = "artifacts/auth-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19502

[services.development]
run = "pnpm --filter @workspace/auth-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/auth-dashboard", "run", "build" ]
publicDir = "artifacts/auth-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19502"
BASE_PATH = "/"
