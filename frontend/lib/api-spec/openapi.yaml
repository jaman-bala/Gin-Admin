openapi: 3.0.0
info:
  description: API for managing users and authentication in the Auth Service application.
  title: AUTH SERVICE API
  contact: {}
  version: "1.0"
paths:
  /api/v1/audit:
    get:
      security:
        - BearerAuth: []
      tags:
        - audit
      summary: Get all user actions
      operationId: getAuditLogs
      parameters:
        - description: Page number
          name: page
          in: query
          schema:
            type: integer
            default: 1
        - description: Items per page
          name: limit
          in: query
          schema:
            type: integer
            default: 10
        - description: Filter by entity ID
          name: entity_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auditlog.AuditLogListResponse"
  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Login user
      operationId: authLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.LoginRequestDTO"
        description: Login credentials
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.LoginResponseDTO"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/auth/logout:
    post:
      security:
        - BearerAuth: []
      tags:
        - auth
      summary: Logout user
      operationId: authLogout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.LogoutRequestDTO"
        description: Optional refresh token to invalidate
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh access token
      operationId: authRefresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.RefreshTokenRequest"
        description: Refresh token
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.LoginResponseDTO"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/users:
    get:
      security:
        - BearerAuth: []
      tags:
        - users
      summary: Get all users with pagination
      operationId: listUsers
      parameters:
        - description: Page number
          name: page
          in: query
          schema:
            type: integer
            default: 1
        - description: Items per page
          name: limit
          in: query
          schema:
            type: integer
            default: 10
        - description: Search by name or phone
          name: search
          in: query
          schema:
            type: string
        - description: Filter by active status
          name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user.UserListResponse"
    post:
      security:
        - BearerAuth: []
      tags:
        - users
      summary: Create user (admin only)
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/user.UserRequestDTO"
        description: User data
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user.UserResponseDTO"
  /api/v1/users/me:
    get:
      security:
        - BearerAuth: []
      tags:
        - users
      summary: Get current user profile
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user.UserResponseDTO"
    put:
      security:
        - BearerAuth: []
      tags:
        - users
      summary: Update own profile
      operationId: updateMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/user.UserSelfUpdateDTO"
        description: Fields to update
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user.UserResponseDTO"
  "/api/v1/users/phone/{phone}":
    get:
      security:
        - BearerAuth: []
      tags:
        - users
      summary: Get user by phone
      operationId: getUserByPhone
      parameters:
        - description: User phone
          name: phone
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user.UserResponseDTO"
  /api/v1/users/stats:
    get:
      security:
        - BearerAuth: []
      tags:
        - analytics
      summary: Get user statistics
      operationId: getUserStats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/analytics.UserStats"
  "/api/v1/users/{id}":
    get:
      security:
        - BearerAuth: []
      tags:
        - users
      summary: Get user by ID
      operationId: getUser
      parameters:
        - description: User ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user.UserResponseDTO"
    delete:
      security:
        - BearerAuth: []
      tags:
        - users
      summary: Delete user (admin only)
      operationId: deleteUser
      parameters:
        - description: User ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    patch:
      security:
        - BearerAuth: []
      tags:
        - users
      summary: Update user (admin only)
      operationId: updateUser
      parameters:
        - description: User ID
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/user.UserUpdateDTO"
        description: Fields to update
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user.UserResponseDTO"
  /health:
    get:
      tags:
        - health
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
servers:
  - url: //localhost:8082
components:
  securitySchemes:
    BearerAuth:
      description: "Enter: Bearer {your_jwt_token} (e.g., Bearer eyJhbGciOiJIUzI1NiIs...)"
      type: apiKey
      name: Authorization
      in: header
  schemas:
    analytics.UserStats:
      type: object
      properties:
        active:
          type: integer
          format: int64
        admins:
          type: integer
          format: int64
        inactive:
          type: integer
          format: int64
        newThisMonth:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    auditlog.AuditLogListResponse:
      type: object
      properties:
        limit:
          type: integer
        logs:
          type: array
          items:
            $ref: "#/components/schemas/auditlog.ResponseDTO"
        page:
          type: integer
        total:
          type: integer
    auditlog.ResponseDTO:
      type: object
      properties:
        action:
          type: string
        client_ip:
          type: string
        created_at:
          type: string
        description:
          type: string
        entity:
          type: string
        entity_id:
          type: string
        id:
          type: integer
        status:
          type: integer
        user_agent:
          type: string
        user_id:
          type: string
    auth.LoginRequestDTO:
      type: object
      required:
        - password
        - phone
      properties:
        password:
          type: string
          example: Password123
        phone:
          type: string
          example: "+996500500500"
    auth.LoginResponseDTO:
      type: object
      properties:
        access_token:
          type: string
        message:
          type: string
        refresh_token:
          type: string
    auth.LogoutRequestDTO:
      type: object
      properties:
        refresh_token:
          type: string
    auth.RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
          example: refresh_token
    user.Role:
      type: string
      enum:
        - superuser
        - admin
        - user
      x-enum-varnames:
        - RoleSuperuser
        - RoleAdmin
        - RoleUser
    user.UserListResponse:
      type: object
      properties:
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
        users:
          type: array
          items:
            $ref: "#/components/schemas/user.UserResponseDTO"
    user.UserRequestDTO:
      type: object
      required:
        - password
        - phone
      properties:
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        password:
          type: string
          example: Password123
        phone:
          type: string
          example: "+996500500500"
        role:
          $ref: "#/components/schemas/user.Role"
        telegram:
          type: string
    user.UserResponseDTO:
      type: object
      properties:
        created_at:
          type: string
        deleted_at:
          type: string
        first_name:
          type: string
        id:
          type: string
        is_active:
          type: boolean
        last_name:
          type: string
        middle_name:
          type: string
        phone:
          type: string
        photo:
          type: string
        role:
          $ref: "#/components/schemas/user.Role"
        telegram:
          type: string
        updated_at:
          type: string
    user.UserSelfUpdateDTO:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        password:
          type: string
        phone:
          type: string
          example: "+996500500500"
        telegram:
          type: string
    user.UserUpdateDTO:
      type: object
      properties:
        first_name:
          type: string
        is_active:
          type: boolean
        last_name:
          type: string
        middle_name:
          type: string
        password:
          type: string
        phone:
          type: string
          example: "+996500500500"
        role:
          type: string
        telegram:
          type: string
