services:
  backend:
    container_name: backend
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - server_network
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - .env
    volumes:
      - ./backend:/app

  frontend:
    container_name: frontend
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - server_network
    ports:
      - "8085:80"

  db:
    container_name: db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5412:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - server_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: ["postgres", "-c", "shared_preload_libraries=uuid-ossp"]

  redis:
    container_name: redis
    restart: always
    image: redis:alpine
    ports:
      - "6313:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - server_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  seaweedfs:
    container_name: seaweedfs
    image: chrislusf/seaweedfs:4.52
    # Generates the S3 credentials config from SEAWEEDFS_ACCESS_KEY/SECRET_KEY,
    # then starts master + volume + filer + S3 gateway in one process.
    entrypoint: ["/seaweedfs-entrypoint.sh"]
    # -s3.iam=false: the embedded IAM/STS API is unused (identities come from
    # the S3 config) and would only add attack surface.
    command: ["server", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-filer", "-s3", "-s3.port=8333", "-s3.iam=false", "-metricsPort=9324"]
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # master UI
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    volumes:
      - seaweedfs_data:/data
      - ./deploy/seaweedfs/entrypoint.sh:/seaweedfs-entrypoint.sh:ro
    networks:
      - server_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  postgres_data: {}
  seaweedfs_data: {}

networks:
  server_network:
    driver: bridge
