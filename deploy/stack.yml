x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-deploy-app: &deploy-app
  update_config:
    parallelism: 1
    delay: 10s
    order: start-first
    failure_action: rollback
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3

x-deploy-infra: &deploy-infra
  update_config:
    parallelism: 1
    delay: 5s
    failure_action: rollback
  restart_policy:
    condition: on-failure
    delay: 10s
    max_attempts: 5

services:

  # ── Application ──────────────────────────────────────────────────────────────

  backend:
    image: ${REGISTRY:-registry.example.com}/backend:${VERSION:-latest}
    networks:
      - app
      - monitoring
    environment:
      GIN_MODE: release
      SERVER_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: authdb
      DB_SSLMODE: disable
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "25"
      DB_CONN_MAX_LIFETIME_HOURS: "1"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      SEAWEEDFS_HOST: seaweedfs
      SEAWEEDFS_PORT: "8333"
      SEAWEEDFS_BUCKET_NAME: avatars
      SEAWEEDFS_SSL: "false"
      SEAWEEDFS_PUBLIC_HOST: ${SEAWEEDFS_PUBLIC_HOST:-localhost:8333}
      JWT_EXPIRY_HOURS: "24"
      JWT_REFRESH_EXPIRY_HOURS: "168"
      ADMIN_DEFAULT_PHONE: ${ADMIN_DEFAULT_PHONE:-+996500500500}
    secrets:
      - db_password
      - secret_key
      - seaweedfs_access_key
      - seaweedfs_secret_key
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      <<: *deploy-app
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging

  frontend:
    image: ${REGISTRY:-registry.example.com}/frontend:${VERSION:-latest}
    networks:
      - app
    ports:
      - "8085:80"
    deploy:
      replicas: 1
      <<: *deploy-app
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    logging: *default-logging

  # ── Infrastructure ───────────────────────────────────────────────────────────

  db:
    image: postgres:17-alpine
    networks:
      - app
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: db
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      <<: *deploy-infra
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging: *default-logging
    command: ["postgres", "-c", "shared_preload_libraries=uuid-ossp"]

  redis:
    image: redis:7-alpine
    networks:
      - app
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      <<: *deploy-infra
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    networks:
      - app
      - monitoring # Prometheus scrapes :9324
    volumes:
      - seaweedfs_data:/data
    secrets:
      - seaweedfs_access_key
      - seaweedfs_secret_key
    configs:
      - source: seaweedfs_entrypoint
        target: /seaweedfs-entrypoint.sh
        mode: 0555
    # Generates the S3 credentials config from the secrets above, then starts
    # master + volume + filer + S3 gateway in one process.
    entrypoint: ["/seaweedfs-entrypoint.sh"]
    # -s3.iam=false: the embedded IAM/STS API is unused (identities come from
    # the S3 config) and would only add attack surface.
    command: ["server", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-filer", "-s3", "-s3.port=8333", "-s3.iam=false", "-metricsPort=9324"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      <<: *deploy-infra
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

  # ── Monitoring ────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    networks:
      - monitoring
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_alerts
        target: /etc/prometheus/alerts.yml
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    networks:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboard_loader
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_dashboard_backend
        target: /var/lib/grafana/dashboards/backend.json
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    networks:
      - monitoring
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    networks:
      - app
      - monitoring
    environment:
      REDIS_ADDR: redis://redis:6379
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
    logging: *default-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    networks:
      - app
      - monitoring
    environment:
      DATA_SOURCE_NAME: postgresql://chatuser@db:5432/chatdb?sslmode=disable
    secrets:
      - db_password
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
    logging: *default-logging

networks:
  app:
    driver: overlay
    attachable: true
  monitoring:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  seaweedfs_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

secrets:
  db_password:
    external: true
  secret_key:
    external: true
  seaweedfs_access_key:
    external: true
  seaweedfs_secret_key:
    external: true
  grafana_admin_password:
    external: true

configs:
  seaweedfs_entrypoint:
    file: ./seaweedfs/entrypoint.sh
  prometheus_config:
    file: ./monitoring/prometheus/prometheus.yml
  prometheus_alerts:
    file: ./monitoring/prometheus/alerts.yml
  grafana_datasource:
    file: ./monitoring/grafana/provisioning/datasources/prometheus.yml
  grafana_dashboard_loader:
    file: ./monitoring/grafana/provisioning/dashboards/dashboards.yml
  grafana_dashboard_backend:
    file: ./monitoring/grafana/dashboards/backend.json