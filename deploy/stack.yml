version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-deploy-app: &deploy-app
  update_config:
    parallelism: 1
    delay: 10s
    order: start-first
    failure_action: rollback
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3

x-deploy-infra: &deploy-infra
  update_config:
    parallelism: 1
    delay: 5s
    failure_action: rollback
  restart_policy:
    condition: on-failure
    delay: 10s
    max_attempts: 5

services:

  # ── Application ──────────────────────────────────────────────────────────────

  backend:
    image: ${REGISTRY:-registry.example.com}/chat-backend:${VERSION:-latest}
    networks:
      - app
      - monitoring
    environment:
      GIN_MODE: release
      SERVER_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: chatuser
      DB_NAME: chatdb
      DB_SSLMODE: disable
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "25"
      DB_CONN_MAX_LIFETIME_HOURS: "1"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MINIO_BUCKET_NAME: chat-uploads
      MINIO_SSL: "false"
      MINIO_PUBLIC_HOST: ${MINIO_PUBLIC_HOST:-localhost:9000}
      JWT_EXPIRY_HOURS: "24"
      JWT_REFRESH_EXPIRY_HOURS: "168"
      ADMIN_DEFAULT_PHONE: ${ADMIN_DEFAULT_PHONE:-+996500500500}
    secrets:
      - db_password
      - secret_key
      - minio_access_key
      - minio_secret_key
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      <<: *deploy-app
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging: *default-logging

  frontend:
    image: ${REGISTRY:-registry.example.com}/chat-frontend:${VERSION:-latest}
    networks:
      - app
    ports:
      - "8085:80"
    deploy:
      replicas: 1
      <<: *deploy-app
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    logging: *default-logging

  # ── Infrastructure ───────────────────────────────────────────────────────────

  db:
    image: postgres:17-alpine
    networks:
      - app
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_DB: chatdb
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      <<: *deploy-infra
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging: *default-logging
    command: ["postgres", "-c", "shared_preload_libraries=uuid-ossp"]

  redis:
    image: redis:7-alpine
    networks:
      - app
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      <<: *deploy-infra
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    networks:
      - app
    volumes:
      - minio_data:/data
    secrets:
      - minio_access_key
      - minio_secret_key
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret_key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      <<: *deploy-infra
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging
    command: server --console-address ":9001" /data

  # ── Monitoring ────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    networks:
      - monitoring
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_alerts
        target: /etc/prometheus/alerts.yml
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    networks:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboard_loader
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_dashboard_backend
        target: /var/lib/grafana/dashboards/backend.json
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    networks:
      - monitoring
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    networks:
      - app
      - monitoring
    environment:
      REDIS_ADDR: redis://redis:6379
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
    logging: *default-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    networks:
      - app
      - monitoring
    environment:
      DATA_SOURCE_NAME: postgresql://chatuser@db:5432/chatdb?sslmode=disable
    secrets:
      - db_password
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
    logging: *default-logging

networks:
  app:
    driver: overlay
    attachable: true
  monitoring:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

secrets:
  db_password:
    external: true
  secret_key:
    external: true
  minio_access_key:
    external: true
  minio_secret_key:
    external: true
  grafana_admin_password:
    external: true

configs:
  prometheus_config:
    file: ./monitoring/prometheus/prometheus.yml
  prometheus_alerts:
    file: ./monitoring/prometheus/alerts.yml
  grafana_datasource:
    file: ./monitoring/grafana/provisioning/datasources/prometheus.yml
  grafana_dashboard_loader:
    file: ./monitoring/grafana/provisioning/dashboards/dashboards.yml
  grafana_dashboard_backend:
    file: ./monitoring/grafana/dashboards/backend.json