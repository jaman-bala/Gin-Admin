name: Backend CI

on:
  push:
    branches: [dev, main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  schedule:
    # New advisories appear without any code change; re-scan weekly (Mon 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  # Both tools are built with the project's own Go toolchain (go install), so
  # they always understand the language version declared in go.mod.
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.10.0

jobs:
  test:
    name: Build, vet, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The weekly schedule only needs the vulnerability job.
    if: github.event_name != 'schedule'
    services:
      # Real PostgreSQL for the repository integration tests: constraints,
      # encodings and NULL handling are exactly what mocks cannot catch.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      # Unit tests use in-memory fakes. PostgreSQL integration tests run
      # against the service above; the SeaweedFS ones skip themselves
      # without SEAWEEDFS_TEST_*.
      - name: Test
        env:
          POSTGRES_TEST_DSN: host=localhost port=5432 user=postgres password=test dbname=test sslmode=disable
        run: go test -race -count=1 ./...

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          "$(go env GOPATH)/bin/govulncheck" ./...
